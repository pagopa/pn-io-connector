AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Parameters:
  ProjectName:
    Type: String
    Description: 'Usually pn can be pnXYZ where XYZ are the feature number, useful to create
      experimental environments without crash official development environment'

  AlarmSNSTopicArn:
    Type: String
    Description: ARN of alarm topic

  ContainerImageUri:
    Type: String
    Description: 'Exact container image URI with full repository and image digest'

  MicroserviceNumber:
    Type: Number
    Description: 'Disambiguation useful for load balancer rules'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'The S3 bucket from which to fetch the templates used by this stack.'

  ECSClusterName:
    Type: String
    Description: 'The name of the ECS cluster where the microservice is going to be deployed'

  VpcEgressSubnetsIds:
    Type: String
    Description: 'Subnets where the microservice egress traffic is routed'

  VpcId:
    Type: String
    Description: 'VpcId where the microservice is going to be deployed'

  EcsDefaultSecurityGroup:
    Type: String
    Description: 'Default security group required by infrastructure'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'Load balancer listener where HTTP endpoints is going to be registered'

  ApplicationLoadBalancerDomain:
    Type: String
    Description: 'Base URL of the load balancer where the service is going to be reachable'

  NetworkLoadBalancerLink:
    Type: String
    Description: 'network load balancer link for API-GW'

  MicroserviceBucketName:
    Type: String
    Default: ''
    Description: 'Name of the bucket where the microservice files are copied during deploy'

  MicroserviceBucketBaseKey:
    Type: String
    Default: ''
    Description: 'Base key of the microservice in the s3 bucket'

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Kinesis stream that receive logs'

  Version:
    Type: String
    Description: 'keep track of used projects commitIds'

  EcsLogGroup:
    Type: String
    Description: 'CloudWatch log group name (from storage.yml output)'

  AlbSecurityGroup:
    Type: String
    Description: 'Application load balancer security group'

  HealthCheckInterval:
    Type: Number
    Default: 60

  HealthCheckTimeout:
    Type: Number
    Default: 5

  HealthyThresholdCount:
    Type: Number
    Default: 5

  UnhealthyThresholdCount:
    Type: Number
    Default: 2

  CpuValue:
    Type: Number
    Default: 1024
    Description: Fargate virtual CPU quantity 1024 equals one vCPU

  MemoryAmount:
    Type: String
    Default: 2GB
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]

  AutoscalingCheckPeriod:
    Default: 60
    Type: Number

  AutoscalingDataPointN:
    Default: 1
    Type: Number

  AutoscalingDataPointM:
    Default: 1
    Type: Number

  AutoscalingThreshold:
    Default: 70
    Type: String

  MinTasksNumber:
    Default: 1
    Type: Number

  MaxTasksNumber:
    Default: 3
    Type: Number

  LogAlarmStrategy:
    Type: String
    Default: 'FATAL'

  WireTapLogActivation:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]

  PnCronAnalyzer:
    Type: String
    Default: '-'

  # EFS parameters
  FargateEFSFileSystemID:
    Type: String
    Description: "EFS Filesystem"

  MountEfs:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  LogsKinesisFilterPattern:
    Type: String
    Default: ''

  ApplicativeEnvFileChecksum:
    Type: String
    Default: ''

  PnIoConnectorRequestsTableName:
    Type: String
    Description: 'Name of DynamoDB table pn-IOConnectorRequests (from storage.yml output)'

  PnIoConnectorRequestsTableArn:
    Type: String
    Description: 'ARN of DynamoDB table pn-IOConnectorRequests (from storage.yml output)'

  PnIoConnectorSendQueueName:
    Type: String
    Description: 'Name of SQS queue pn-io-connector-send-queue (from storage.yml output)'

  PnIoConnectorSendQueueArn:
    Type: String
    Description: 'ARN of SQS queue pn-io-connector-send-queue (from storage.yml output)'

  PnIoConnectorSecretsName:
    Type: String
    Description: 'Secret ID for IO Api'

  PnIoConnectorManagedPolicyName:
    Type: String
    Description: 'Nome della managed policy associata ad IO Connector'
    Default: 'PnIoConnectorManagedPolicyName'

  PnCommonsRetryMaxAttempts:
    Type: Number
    Default: 3
    Description: 'Max attempts for pn-commons RestClientRetryable'

  PnCommonsConnectionTimeoutMillis:
    Type: Number
    Default: 10000
    Description: 'Connection timeout in ms for pn-commons RestClient'

  PnCommonsReadTimeoutMillis:
    Type: Number
    Default: 30000
    Description: 'Read timeout in ms for pn-commons RestClient'

  IoApiDnsName:
    Type: String
    Description: 'DNS name of the API Gateway stage exposed to Backend IO'

  LollipopAuthorizerLambdaName:
    Type: String
    Description: 'Name of the LollipopAuthorizer Lambda function (from pn-auth-fleet)'

  PnDataVaultBaseUrl:
    Type: String
    Default: 'http://alb.confidential.pn.internal:8080'
    Description: 'Base URL of pn-data-vault internal service'

  PnIoConnectorEventBridgeBusName:
    Type: String
    Description: 'Name of the EventBridge bus for IO Connector outcome events'

  PnIoConnectorEventBridgeBusArn:
    Type: String
    Description: 'ARN of the EventBridge bus for IO Connector outcome events'

  PnIoConnectorPollingQueueName:
    Type: String
    Description: 'Name of SQS queue pn-io-connector-polling-queue (from storage.yml output)'

  PnIoConnectorPollingQueueArn:
    Type: String
    Description: 'ARN of SQS queue pn-io-connector-polling-queue (from storage.yml output)'

  PnIoConnectorPollingIntervalHours:
    Type: Number
    Default: 24
    Description: 'Default polling max window in hours (used when pollingMaxDate is not set in the send request); polling interval = clamp(window/4, 15min, 6h)'

  PnIoConnectorIoConfigurationId:
    Type: String
    Description: 'IO Remote configuration for attachments download'

  # -- Lambda downloadAttachment params ----------------------------------------------
  SafeStorageProtocol:
    Type: String
    Default: http
    AllowedValues: [ http, https ]

  SafeStoragePort:
    Type: String
    Default: '8080'

  SafeStorageGetFilePath:
    Type: String
    Default: /safestorage/internal/v1/files

  SafeStorageCxId:
    Type: String
    Default: pn-io-connector

  SafeStorageApiKey:
    Type: String
    Default: pn-io-connector_api_key

  SafeStoragePresignedUrlField:
    Type: String
    Default: download.url
    Description: 'Dot-notation path to the presigned URL field in the SafeStorage response'

  DownloadModeRedirect:
    Type: String
    Default: 'false'
    AllowedValues: [ 'true', 'false' ]
    Description: 'true returns 302 Location; false returns the PDF binary'

Resources:
  PnIoConnectorMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub '${TemplateBucketBaseUrl}/fragments/ecs-service.yaml'
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-io-connector'
        CpuValue: !Ref CpuValue
        CpuArchitecture: ARM
        MemoryAmount: !Ref MemoryAmount
        HealthCheckTimeout: !Ref HealthCheckTimeout
        HealthCheckInterval: !Ref HealthCheckInterval
        HealthyThresholdCount: !Ref HealthyThresholdCount
        UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
        AutoscalingStrategy: REST-API
        AutoscalingThreshold: !Ref AutoscalingThreshold
        AutoscalingCheckPeriod: !Ref AutoscalingCheckPeriod
        MinTasksNumber: !Ref MinTasksNumber
        MaxTasksNumber: !Ref MaxTasksNumber
        AutoscalingDataPointN: !Ref AutoscalingDataPointN
        AutoscalingDataPointM: !Ref AutoscalingDataPointM
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        EfsFilesystem: !Ref FargateEFSFileSystemID
        MountEfs: !Ref MountEfs
        ContainerImageURI: !Sub '${ContainerImageUri}'
        ContainerEnvEntry1: !Sub 'AWS_REGIONCODE=${AWS::Region}'
        ContainerEnvEntry2: !Sub 'WIRE_TAP_LOG_ACTIVATION=${WireTapLogActivation}'
        ContainerEnvEntry3: !Sub 'PN_CRON_ANALYZER=${PnCronAnalyzer}'
        ContainerEnvEntry4: !Sub 'PN_IO_CONNECTOR_DYNAMODB_TABLE_NAME=${PnIoConnectorRequestsTableName}'
        ContainerEnvEntry5: !Sub 'PN_IO_CONNECTOR_SECRETS_NAME=${PnIoConnectorSecretsName}'
        ContainerEnvEntry6: !Sub 'PN_IO_CONNECTOR_SQS_SEND_QUEUE_NAME=${PnIoConnectorSendQueueName}'
        ContainerEnvEntry7: !Sub 'PN_COMMONS_RETRY_MAX_ATTEMPTS=${PnCommonsRetryMaxAttempts}'
        ContainerEnvEntry8: !Sub 'PN_COMMONS_CONNECTION_TIMEOUT_MILLIS=${PnCommonsConnectionTimeoutMillis}'
        ContainerEnvEntry9: !Sub 'PN_COMMONS_READ_TIMEOUT_MILLIS=${PnCommonsReadTimeoutMillis}'
        ContainerEnvEntry10: !Sub 'PN_IO_CONNECTOR_DATA_VAULT_BASE_URL=${PnDataVaultBaseUrl}'
        ContainerEnvEntry11: !Sub 'PN_IO_CONNECTOR_EVENT_BRIDGE_BUS_NAME=${PnIoConnectorEventBridgeBusName}'
        ContainerEnvEntry12: !Sub 'PN_IO_CONNECTOR_SQS_POLLING_QUEUE_NAME=${PnIoConnectorPollingQueueName}'
        ContainerEnvEntry13: !Sub 'PN_IO_CONNECTOR_POLLING_INTERVAL_HOURS=${PnIoConnectorPollingIntervalHours}'
        ContainerEnvEntry14: !Sub 'PN_IO_CONNECTOR_IO_CONFIGURATION_ID=${PnIoConnectorIoConfigurationId}'
        MappedPaths: '/io-connector/message*,/io-connector/profile*'
        ECSClusterName: !Ref ECSClusterName
        Subnets: !Ref VpcEgressSubnetsIds
        VpcId: !Ref VpcId
        EcsDefaultSecurityGroup: !Ref EcsDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref ApplicationLoadBalancerListenerArn
        LoadbalancerRulePriority: !Ref MicroserviceNumber
        AlbSecurityGroup: !Ref AlbSecurityGroup
        TaskRoleManagedPolicyArn: !Ref PnIoConnectorManagedPolicy
        EcsLogGroup: !Ref EcsLogGroup
        LogAlarmStrategyV1: !Ref LogAlarmStrategy
        ApplicativeEnvFileChecksum: !Ref ApplicativeEnvFileChecksum

  PnIoConnectorManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: 'Managed policy granting pn-io-connector access to S3, SSM, DynamoDB, SQS, Secrets Manager and EventBridge'
      ManagedPolicyName: !Ref PnIoConnectorManagedPolicyName
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub "arn:aws:s3:::pn-runtime-environment-variables-${AWS::Region}-${AWS::AccountId}/pn-io-connector/*"
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/io-connector/*'
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource:
              - !Ref PnIoConnectorRequestsTableArn
              - !Sub '${PnIoConnectorRequestsTableArn}/index/*'
          - Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:SendMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !Ref PnIoConnectorSendQueueArn
          - Effect: Allow
            Sid: 'ReadFromSecretsManagerIOConnectorSecrets'
            Action:
              - 'secretsmanager:DescribeSecret'
              - 'secretsmanager:GetSecretValue'
            Resource:
              - !Join [ '', [ !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:' , !Ref PnIoConnectorSecretsName , '*' ] ]
          - Effect: Allow
            Action:
              - 'events:DescribeEventBus'
              - 'events:PutEvents'
            Resource:
              - !Ref PnIoConnectorEventBridgeBusArn
          - Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:SendMessage
              - sqs:GetQueueUrl
              - sqs:GetQueueAttributes
              - sqs:ChangeMessageVisibility
            Resource: !Ref PnIoConnectorPollingQueueArn

  PnIoConnectorIoApi:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub '${TemplateBucketBaseUrl}/fragments/api-gw-expose-service-openapi.yaml'
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-io-connector'
        IntendedUsage: IO
        DnsName: !Ref IoApiDnsName
        ProjectName: !Ref ProjectName
        ServiceApiPath: 'io-connector'
        NetworkLoadBalancerLink: !Ref NetworkLoadBalancerLink
        ApplicationLoadBalancerDomain: !Ref ApplicationLoadBalancerDomain
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        CloudwatchLogKinesisStreamArn: !Ref LogsKinesisSourceStreamArn
        OpenApiBucketName: !Ref MicroserviceBucketName
        OpenApiBucketKey: !Sub '${MicroserviceBucketBaseKey}/docs/openapi/aws/api-io-connector-IO-aws.yaml'

  DownloadAttachmentsLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-download-attachments-lambda-sg'
      VpcId: !Ref VpcId

  DownloadAttachmentsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DownloadAttachmentsLambda.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PnIoConnectorIoApi.Outputs.RestApiId}/*/*/io-connector/messages/*'

  DownloadAttachmentsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-download-attachments'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt DownloadAttachmentsLambdaRole.Arn
      Code:
        S3Bucket: !Ref MicroserviceBucketName
        S3Key: !Sub '${MicroserviceBucketBaseKey}/functions_zip/downloadAttachments.zip'
      Timeout: 10
      LoggingConfig:
        LogGroup: !Sub '/aws/lambda/${ProjectName}-download-attachments'
      TracingConfig:
        Mode: Active
      Layers:
        - !Sub 'arn:aws:lambda:${AWS::Region}:339249233099:layer:LambdaInsightsExtension:13'
      VpcConfig:
        SubnetIds:
          - !Select [ 0, !Split [ ',', !Ref VpcEgressSubnetsIds ] ]
          - !Select [ 1, !Split [ ',', !Ref VpcEgressSubnetsIds ] ]
          - !Select [ 2, !Split [ ',', !Ref VpcEgressSubnetsIds ] ]
        SecurityGroupIds:
          - !GetAtt DownloadAttachmentsLambdaSecurityGroup.GroupId
      Environment:
        Variables:
          DOWNLOAD_MODE_REDIRECT: !Ref DownloadModeRedirect
          REQUESTS_TABLE_NAME: !Ref PnIoConnectorRequestsTableName
          PN_SAFESTORAGE_PROTOCOL: !Ref SafeStorageProtocol
          PN_SAFESTORAGE_HOSTNAME: !Sub '${ApplicationLoadBalancerDomain}'
          PN_SAFESTORAGE_PORT: !Ref SafeStoragePort
          PN_SAFESTORAGE_GET_FILE_PATH: !Ref SafeStorageGetFilePath
          PN_SAFESTORAGE_API_KEY: !Ref SafeStorageApiKey
          PN_SAFESTORAGE_CX_ID: !Ref SafeStorageCxId
          PN_SAFESTORAGE_PRESIGNED_URL: !Ref SafeStoragePresignedUrlField

  DownloadAttachmentsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-download-attachment-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDbQueryPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Ref PnIoConnectorRequestsTableArn