AWSTemplateFormatVersion: '2010-09-09'
Description: Storage resources for pn-io-connector

Parameters:
  ProjectName:
    Type: String
    Description: Nome dell'ambiente destinazione

  # Unused but required by CD pipeline
  MicroserviceNumber:
    Type: Number
    Description: An unique number that identify the microservice inside the ECS cluster.

  # Unused but required by CD pipeline
  TemplateBucketBaseUrl:
    Type: String
    Description: URL da cui caricare i frammenti di template di infrastruttura

  Version:
    Type: String
    Description: 'keep track of used projects commitIds'

  AlarmSNSTopicName:
    Type: String
    Description: 'Topic alarm'

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'Where to send Logs'

  LogRetention:
    Type: Number
    Default: 14

Resources:

  # ── DynamoDB ───────────────────────────────────────────────────────────────

  PnIOConnectorRequestsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-IOConnectorRequests'
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: ioMessageId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ioMessageIdIndex
          KeySchema:
            - AttributeName: ioMessageId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── Log Group ──────────────────────────────────────────────────────────────

  PnIoConnectorLogGroup:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/log-group.yaml"
      Parameters:
        LogGroupName: !Sub '${ProjectName}-io-connector'
        LogGroupRetention: !Ref LogRetention
        LogsKinesisSourceStreamArn: !Ref LogsKinesisSourceStreamArn

Outputs:

  # DynamoDB
  IOConnectorRequestsTableName:
    Value: !Ref PnIOConnectorRequestsTable
    Description: pn-IOConnectorRequests DynamoDB table name

  IOConnectorRequestsTableArn:
    Value: !GetAtt PnIOConnectorRequestsTable.Arn
    Description: pn-IOConnectorRequests DynamoDB table ARN

  # Log Group
  EcsLogGroup:
    Value: !GetAtt PnIoConnectorLogGroup.Outputs.LogGroupName
    Description: pn-io-connector ECS log group name
