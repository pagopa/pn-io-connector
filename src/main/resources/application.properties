logging.config=classpath:logback-base.xml

pn.env.runtime=PROD
spring.application.name=PN-IO-CONNECTOR
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,metrics,loggers
spring.threads.virtual.enabled=true

pn.io-connector.io-base-url=https://api.io.pagopa.it/api/v1

pn.io-connector.data-vault-base-url=
pn.io-connector.sqs-send-queue-name=
pn.io-connector.sqs-polling-queue-name=
pn.io-connector.polling-interval-hours=24
pn.io-connector.send-retry-policy=5,10,20,40
