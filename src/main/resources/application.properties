logging.config=classpath:logback-base.xml

pn.env.runtime=PROD
spring.application.name=PN-IO-CONNECTOR
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,metrics,loggers
spring.threads.virtual.enabled=true

pn.io-connector.io-base-url=${PN_IO_CONNECTOR_IO_BASE_URL:https://api.io.pagopa.it/api/v1}
pn.io-connector.io-legal-base-url=${PN_IO_CONNECTOR_IO_LEGAL_BASE_URL:https://api.io.pagopa.it/api/v1}

pn.io-connector.data-vault-base-url=${PN_IO_CONNECTOR_DATA_VAULT_BASE_URL}
pn.io-connector.legal-secrets-name=${PN_IO_CONNECTOR_LEGAL_SECRETS_NAME}
pn.io-connector.service-configurations-parameter-name=${PN_IO_CONNECTOR_SERVICE_CONFIGURATIONS_PARAMETER_NAME}
pn.io-connector.sqs-send-queue-name=${PN_IO_CONNECTOR_SQS_SEND_QUEUE_NAME}
pn.io-connector.sqs-polling-queue-name=${PN_IO_CONNECTOR_SQS_POLLING_QUEUE_NAME}
pn.io-connector.polling-interval-mins=${PN_IO_CONNECTOR_POLLING_INTERVAL_MINS:2880}
pn.io-connector.polling-fixed-interval-seconds=${PN_IO_CONNECTOR_POLLING_FIXED_INTERVAL_SECONDS:0}
pn.io-connector.send-retry-policy=5,10,20,40
pn.io-connector.optin-dynamodb-table-name=${PN_IO_CONNECTOR_OPTIN_DYNAMODB_TABLE_NAME}
pn.io-connector.io-optin-min-days=${PN_IO_CONNECTOR_IO_OPTIN_MIN_DAYS:0}

pn.io-connector.enable-io-message=${PN_IO_CONNECTOR_ENABLE_IO_MESSAGE:true}
pn.io-connector.enable-io-activation-message=${PN_IO_CONNECTOR_ENABLE_IO_ACTIVATION_MESSAGE:true}
pn.io-connector.io-remote-content-cfg-id=${PN_IO_CONNECTOR_IO_REMOTE_CONTENT_CFG_ID}
pn.io-connector.piattaformanotificheurl-cittadini=${PN_IO_CONNECTOR_PIATTAFORMANOTIFICHEURL_CITTADINI:https://notifichedigitali.pagopa.it/cittadini}
pn.io-connector.piattaformanotificheurl-tos=${PN_IO_CONNECTOR_PIATTAFORMANOTIFICHEURL_TOS:https://notifichedigitali.it/tos.html}
pn.io-connector.piattaformanotificheurl-privacy=${PN_IO_CONNECTOR_PIATTAFORMANOTIFICHEURL_PRIVACY:https://notifichedigitali.it/privacy.html}
pn.io-connector.sqs-delivery-push-input-queue-name=${PN_IO_CONNECTOR_SQS_DELIVERY_PUSH_INPUT_QUEUE_NAME}

pn.commons.retry.max-attempts=${PN_COMMONS_RETRY_MAX_ATTEMPTS:3}
pn.commons.connection-timeout-millis=${PN_COMMONS_CONNECTION_TIMEOUT_MILLIS:10000}
pn.commons.read-timeout-millis=${PN_COMMONS_READ_TIMEOUT_MILLIS:30000}