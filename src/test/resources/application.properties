#logging.config=config/logback-local.xml
spring.application.name=PN-IO-CONNECTOR

# AWS specific configurations
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566

# Runtime mode
pn.env.runtime=DEVELOPMENT
#pn.env.runtime=PROD

# RestClientFactory properties
pn.commons.retry.max-attempts=0
pn.commons.connection-timeout-millis=5000
pn.commons.read-timeout-millis=5000
pn.log.trace-id-header=X-Amzn-Trace-Id