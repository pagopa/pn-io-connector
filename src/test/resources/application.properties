#logging.config=config/logback-local.xml
spring.application.name=PN-IO-CONNECTOR

# AWS specific configurations
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566

# Runtime mode
pn.env.runtime=DEVELOPMENT
#pn.env.runtime=PROD

# RestClientFactory properties
pn.commons.retry.max-attempts=0
pn.commons.connection-timeout-millis=5000
pn.commons.read-timeout-millis=5000
pn.log.trace-id-header=X-Amzn-Trace-Id

# DynamoDB
pn.io-connector.dynamodb-table-name=pn-IOConnectorRequests
pn.io-connector.optin-dynamodb-table-name=pn-IOConnectorOptIn
pn.io-connector.sqs-send-queue-name=pn-io-connector-send-queue
pn.io-connector.sqs-polling-queue-name=pn-io-connector-polling-queue
pn.io-connector.polling-interval-mins=1440

# SecretsManager
pn.io-connector.secrets-name=Pn-IO-Connector-Secrets
pn.io-connector.legal-secrets-name=Pn-IO-Connector-Legal-Secrets

# Parameter Store
pn.io-connector.service-configurations-parameter-name=IoConnectorServiceConfiguration

# REST client base URLs
pn.io-connector.io-base-url=http://localhost
pn.io-connector.io-legal-base-url=http://localhost
pn.io-connector.data-vault-base-url=http://localhost
pn.io-connector.send-retry-policy=5,10,20,40

# Cooldown invii opt-in
pn.io-connector.io-optin-min-days=30

# Dominio legale - invio messaggi
pn.io-connector.enable-io-message=true
pn.io-connector.enable-io-activation-message=true
pn.io-connector.io-remote-content-cfg-id=01HMVMHCZZ8D0VTFWMRHBM5D6F
pn.io-connector.piattaformanotificheurl-cittadini=https://notifichedigitali.pagopa.it/cittadini
pn.io-connector.piattaformanotificheurl-tos=https://notifichedigitali.it/tos.html
pn.io-connector.piattaformanotificheurl-privacy=https://notifichedigitali.it/privacy.html
pn.io-connector.sqs-delivery-push-input-queue-name=local-delivery-push-inputs.fifo
