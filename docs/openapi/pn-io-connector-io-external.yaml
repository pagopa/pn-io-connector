openapi: 3.0.1
info:
  title: pn-io-connector - endpoint esposti verso Backend IO
  version: 1.0.0
  description: >
    Endpoint invocati da Backend IO per il recupero dei dettagli di un messaggio
    e il download degli allegati, protetti da autenticazione Lollipop.

tags:
  - name: IoConnector
    description: Operazioni verso App IO
  - name: FromIoMessage
    description: Endpoint invocati da App IO per il disclaimer di pre-apertura notifica

paths:
  /io-connector/messages/{id}:
    get:
      summary: Recupero metadati allegati di un messaggio
      operationId: getMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/cxTaxId'
        - $ref: '#/components/parameters/lollipopOriginalMethod'
        - $ref: '#/components/parameters/lollipopOriginalUrl'
        - $ref: '#/components/parameters/lollipopPublicKey'
        - $ref: '#/components/parameters/lollipopAssertionRef'
        - $ref: '#/components/parameters/lollipopAssertionType'
        - $ref: '#/components/parameters/lollipopAuthJwt'
        - $ref: '#/components/parameters/lollipopUserId'
        - $ref: '#/components/parameters/lollipopSignatureInput'
        - $ref: '#/components/parameters/lollipopSignature'
      responses:
        '200':
          description: Metadati degli allegati associati al messaggio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessageResponse'
        '404':
          description: Messaggio non trovato (richiesta inesistente o codice fiscale del chiamante non coerente con il destinatario).
        '500':
          description: Errore interno.

  /io-connector/messages/{id}/{url}:
    get:
      summary: Download allegato di un messaggio
      operationId: getAttachment
      x-pagopa-lambda-name: pn-download-attachments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: url
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/cxTaxId'
        - $ref: '#/components/parameters/lollipopOriginalMethod'
        - $ref: '#/components/parameters/lollipopOriginalUrl'
        - $ref: '#/components/parameters/lollipopPublicKey'
        - $ref: '#/components/parameters/lollipopAssertionRef'
        - $ref: '#/components/parameters/lollipopAssertionType'
        - $ref: '#/components/parameters/lollipopAuthJwt'
        - $ref: '#/components/parameters/lollipopUserId'
        - $ref: '#/components/parameters/lollipopSignatureInput'
        - $ref: '#/components/parameters/lollipopSignature'
      responses:
        '200':
          description: Contenuto binario dell'allegato (modalità bytestream).
          content:
            application/pdf: {}
        '302':
          description: Redirect alla presignedUri di SafeStorage.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Messaggio o allegato non trovato (richiesta inesistente o codice fiscale del chiamante non coerente con il destinatario).
        '500':
          description: Errore interno.

  /io-connector/io/v1/notification-disclaimer/{iun}:
    get:
      tags: [FromIoMessage]
      summary: Disclaimer di pre-apertura notifica
      operationId: notificationDisclaimer
      parameters:
        - name: iun
          in: path
          required: true
          schema:
            type: string
          description: Identificativo Univoco Notifica su SEND.
        - $ref: '#/components/parameters/cxIdAuthFleet'
      responses:
        '200':
          description: Contenuto del bottom sheet di pre-apertura notifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreconditionContent'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

components:
  responses:
    Problem:
      description: Errore.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'

  parameters:
    cxIdAuthFleet:
      name: x-pagopa-pn-cx-id
      in: header
      required: true
      schema:
        type: string
      description: Identificativo interno (internalId) del destinatario, iniettato dall'API Gateway.
    cxTaxId:
      name: x-pagopa-cx-taxid
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 16
        pattern: >-
          ^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1}$
      description: Codice fiscale del destinatario inviato da Backend IO (identitySource per il LollipopAuthorizer; sostituito nell'integrazione con l'internalId via context.authorizer.cx_id)
    lollipopOriginalMethod:
      name: x-pagopa-lollipop-original-method
      in: header
      required: false
      schema:
        type: string
        enum: [GET, POST, PUT, DELETE, PATCH]
    lollipopOriginalUrl:
      name: x-pagopa-lollipop-original-url
      in: header
      required: false
      schema:
        type: string
    lollipopPublicKey:
      name: x-pagopa-lollipop-public-key
      in: header
      required: false
      schema:
        type: string
        format: base64
    lollipopAssertionRef:
      name: x-pagopa-lollipop-assertion-ref
      in: header
      required: false
      schema:
        type: string
    lollipopAssertionType:
      name: x-pagopa-lollipop-assertion-type
      in: header
      required: false
      schema:
        type: string
        enum: [SAML, OIDC]
    lollipopAuthJwt:
      name: x-pagopa-lollipop-auth-jwt
      in: header
      required: false
      schema:
        type: string
    lollipopUserId:
      name: x-pagopa-lollipop-user-id
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 16
    lollipopSignatureInput:
      name: signature-input
      in: header
      required: false
      schema:
        type: string
    lollipopSignature:
      name: signature
      in: header
      required: false
      schema:
        type: string

  schemas:
    PreconditionContent:
      type: object
      description: Contenuto del bottom sheet di pre-apertura notifica.
      required:
        - title
        - markdown
      additionalProperties: false
      properties:
        title:
          type: string
          description: Titolo del bottom sheet.
        markdown:
          type: string
          description: Corpo del bottom sheet in formato Markdown.

    Problem:
      type: object
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        traceId:
          type: string

    GetMessageResponse:
      type: object
      description: Dettagli del messaggio e lista degli allegati esposti a BackEnd IO.
      properties:
        details:
          type: object
          properties:
            subject:
              type: string
            markdown:
              type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                maxLength: 127
              content_type:
                type: string
                default: application/pdf
              url:
                type: string
                format: uri
              category:
                type: string
                default: DOCUMENT
