openapi: 3.0.1
info:
  title: >-
    ${stageVariables.ProjectName}-${stageVariables.MicroServiceUniqueName}-${stageVariables.IntendedUsage}
  version: t3q3heB8E5+awp82EBPolr6DwzDy+ljbL8TpkIp31C4=
servers:
  - url: https://${stageVariables.DnsName}/{basePath}
    variables:
      basePath:
        default: /${stageVariables.ServiceApiPath}
    x-amazon-apigateway-endpoint-configuration:
      disableExecuteApiEndpoint: true
paths:
  /messages/{id}:
    get:
      summary: Recupero metadati allegati di un messaggio
      operationId: getMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/cxTaxId'
        - $ref: '#/components/parameters/lollipopOriginalMethod'
        - $ref: '#/components/parameters/lollipopOriginalUrl'
        - $ref: '#/components/parameters/lollipopPublicKey'
        - $ref: '#/components/parameters/lollipopAssertionRef'
        - $ref: '#/components/parameters/lollipopAssertionType'
        - $ref: '#/components/parameters/lollipopAuthJwt'
        - $ref: '#/components/parameters/lollipopUserId'
        - $ref: '#/components/parameters/lollipopSignatureInput'
        - $ref: '#/components/parameters/lollipopSignature'
      responses:
        '200':
          description: Metadati degli allegati associati al messaggio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessageResponse'
        '404':
          description: >-
            Messaggio non trovato (richiesta inesistente o codice fiscale del
            chiamante non coerente con il destinatario).
        '500':
          description: Errore interno.
      security:
        - pn-auth-fleet_LollipopAuthorizer_openapi: []
        - api_key_openapi: []
      x-amazon-apigateway-integration:
        uri: >-
          http://${stageVariables.ApplicationLoadBalancerDomain}:8080/${stageVariables.ServiceApiPath}/messages/{id}
        connectionId: ${stageVariables.NetworkLoadBalancerLink}
        httpMethod: ANY
        requestParameters:
          integration.request.header.x-pagopa-pn-cx-id: context.authorizer.cx_id
          integration.request.header.x-pagopa-pn-cx-role: context.authorizer.cx_role
          integration.request.header.x-pagopa-pn-uid: context.authorizer.uid
          integration.request.header.x-pagopa-pn-jti: context.authorizer.cx_jti
          integration.request.header.x-pagopa-pn-cx-type: context.authorizer.cx_type
          integration.request.header.x-pagopa-pn-cx-groups: context.authorizer.cx_groups
          integration.request.header.x-pagopa-pn-src-ch-details: context.authorizer.sourceChannelDetails
          integration.request.header.x-pagopa-pn-src-ch: '''IO'''
          integration.request.header.x-pagopa-pn-name: context.authorizer.name
          integration.request.header.x-pagopa-pn-family-name: context.authorizer.familyName
          integration.request.header.x-pagopa-pn-result-code: context.authorizer.resultCode
          integration.request.path.id: method.request.path.id
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
        timeoutInMillis: 29000
        type: http_proxy
    options:
      operationId: Options for /messages/{id} API CORS
      x-amazon-apigateway-integration:
        uri: >-
          http://${stageVariables.ApplicationLoadBalancerDomain}:8080/${stageVariables.ServiceApiPath}/messages/{id}
        connectionId: ${stageVariables.NetworkLoadBalancerLink}
        httpMethod: ANY
        requestParameters:
          integration.request.path.id: method.request.path.id
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
        timeoutInMillis: 29000
        type: http_proxy
  /messages/{id}/{url}:
    get:
      summary: Download allegato di un messaggio
      operationId: getAttachment
      x-pagopa-lambda-name: pn-download-attachments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: url
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/cxTaxId'
        - $ref: '#/components/parameters/lollipopOriginalMethod'
        - $ref: '#/components/parameters/lollipopOriginalUrl'
        - $ref: '#/components/parameters/lollipopPublicKey'
        - $ref: '#/components/parameters/lollipopAssertionRef'
        - $ref: '#/components/parameters/lollipopAssertionType'
        - $ref: '#/components/parameters/lollipopAuthJwt'
        - $ref: '#/components/parameters/lollipopUserId'
        - $ref: '#/components/parameters/lollipopSignatureInput'
        - $ref: '#/components/parameters/lollipopSignature'
      responses:
        '200':
          description: Contenuto binario dell'allegato (modalità bytestream).
          content:
            application/octet-stream: {}
        '302':
          description: Redirect alla presignedUri di SafeStorage.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: >-
            Messaggio o allegato non trovato (richiesta inesistente o codice
            fiscale del chiamante non coerente con il destinatario).
        '500':
          description: Errore interno.
      security:
        - pn-auth-fleet_LollipopAuthorizer_openapi: []
        - api_key_openapi: []
      x-amazon-apigateway-integration:
        uri: >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pn-download-attachments/invocations
        httpMethod: POST
        requestParameters:
          integration.request.header.x-pagopa-pn-cx-id: context.authorizer.cx_id
          integration.request.header.x-pagopa-pn-cx-role: context.authorizer.cx_role
          integration.request.header.x-pagopa-pn-uid: context.authorizer.uid
          integration.request.header.x-pagopa-pn-jti: context.authorizer.cx_jti
          integration.request.header.x-pagopa-pn-cx-type: context.authorizer.cx_type
          integration.request.header.x-pagopa-pn-cx-groups: context.authorizer.cx_groups
          integration.request.header.x-pagopa-pn-src-ch-details: context.authorizer.sourceChannelDetails
          integration.request.header.x-pagopa-pn-src-ch: '''IO'''
          integration.request.header.x-pagopa-pn-name: context.authorizer.name
          integration.request.header.x-pagopa-pn-family-name: context.authorizer.familyName
          integration.request.header.x-pagopa-pn-result-code: context.authorizer.resultCode
          integration.request.path.id: method.request.path.id
          integration.request.path.url: method.request.path.url
        passthroughBehavior: when_no_match
        timeoutInMillis: 29000
        type: aws_proxy
  /io/v1/notification-disclaimer/{iun}:
    get:
      tags:
        - FromIoMessage
      summary: Disclaimer di pre-apertura notifica
      operationId: notificationDisclaimer
      parameters:
        - name: iun
          in: path
          required: true
          schema:
            type: string
          description: Identificativo Univoco Notifica su SEND.
        - $ref: '#/components/parameters/cxIdAuthFleet'
      responses:
        '200':
          description: Contenuto del bottom sheet di pre-apertura notifica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreconditionContent'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
      security:
        - pn-auth-fleet_LollipopAuthorizer_openapi: []
        - api_key_openapi: []
      x-amazon-apigateway-integration:
        uri: >-
          http://${stageVariables.ApplicationLoadBalancerDomain}:8080/${stageVariables.ServiceApiPath}/io/v1/notification-disclaimer/{iun}
        connectionId: ${stageVariables.NetworkLoadBalancerLink}
        httpMethod: ANY
        requestParameters:
          integration.request.header.x-pagopa-pn-cx-id: context.authorizer.cx_id
          integration.request.header.x-pagopa-pn-cx-role: context.authorizer.cx_role
          integration.request.header.x-pagopa-pn-uid: context.authorizer.uid
          integration.request.header.x-pagopa-pn-jti: context.authorizer.cx_jti
          integration.request.header.x-pagopa-pn-cx-type: context.authorizer.cx_type
          integration.request.header.x-pagopa-pn-cx-groups: context.authorizer.cx_groups
          integration.request.header.x-pagopa-pn-src-ch-details: context.authorizer.sourceChannelDetails
          integration.request.header.x-pagopa-pn-src-ch: '''IO'''
          integration.request.header.x-pagopa-pn-name: context.authorizer.name
          integration.request.header.x-pagopa-pn-family-name: context.authorizer.familyName
          integration.request.header.x-pagopa-pn-result-code: context.authorizer.resultCode
          integration.request.path.iun: method.request.path.iun
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
        timeoutInMillis: 29000
        type: http_proxy
    options:
      operationId: Options for /io/v1/notification-disclaimer/{iun} API CORS
      x-amazon-apigateway-integration:
        uri: >-
          http://${stageVariables.ApplicationLoadBalancerDomain}:8080/${stageVariables.ServiceApiPath}/io/v1/notification-disclaimer/{iun}
        connectionId: ${stageVariables.NetworkLoadBalancerLink}
        httpMethod: ANY
        requestParameters:
          integration.request.path.iun: method.request.path.iun
        passthroughBehavior: when_no_match
        connectionType: VPC_LINK
        timeoutInMillis: 29000
        type: http_proxy
components:
  parameters:
    cxIdAuthFleet:
      name: x-pagopa-pn-cx-id
      in: header
      required: true
      schema:
        type: string
      description: >-
        Identificativo interno (internalId) del destinatario, iniettato dall'API
        Gateway.
    cxTaxId:
      name: x-pagopa-cx-taxid
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 16
        pattern: >-
          ^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{2}[A-Z]{1}[0-9LMNPQRSTUV]{3}[A-Z]{1}$
      description: >-
        Codice fiscale del destinatario inviato da Backend IO (identitySource
        per il LollipopAuthorizer; sostituito nell'integrazione con l'internalId
        via context.authorizer.cx_id)
    lollipopOriginalMethod:
      name: x-pagopa-lollipop-original-method
      in: header
      required: false
      schema:
        type: string
        enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
    lollipopOriginalUrl:
      name: x-pagopa-lollipop-original-url
      in: header
      required: false
      schema:
        type: string
    lollipopPublicKey:
      name: x-pagopa-lollipop-public-key
      in: header
      required: false
      schema:
        type: string
        format: base64
    lollipopAssertionRef:
      name: x-pagopa-lollipop-assertion-ref
      in: header
      required: false
      schema:
        type: string
    lollipopAssertionType:
      name: x-pagopa-lollipop-assertion-type
      in: header
      required: false
      schema:
        type: string
        enum:
          - SAML
          - OIDC
    lollipopAuthJwt:
      name: x-pagopa-lollipop-auth-jwt
      in: header
      required: false
      schema:
        type: string
    lollipopUserId:
      name: x-pagopa-lollipop-user-id
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 16
    lollipopSignatureInput:
      name: signature-input
      in: header
      required: false
      schema:
        type: string
    lollipopSignature:
      name: signature
      in: header
      required: false
      schema:
        type: string
  schemas:
    PreconditionContent:
      type: object
      description: Contenuto del bottom sheet di pre-apertura notifica.
      required:
        - title
        - markdown
      additionalProperties: false
      properties:
        title:
          type: string
          description: Titolo del bottom sheet.
        markdown:
          type: string
          description: Corpo del bottom sheet in formato Markdown.
    Problem:
      type: object
      properties:
        status:
          type: number
        title:
          type: string
        detail:
          type: string
        traceId:
          type: string
    GetMessageResponse:
      type: object
      description: Dettagli del messaggio e lista degli allegati esposti a BackEnd IO.
      properties:
        details:
          type: object
          properties:
            subject:
              type: string
            markdown:
              type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                maxLength: 127
              content_type:
                type: string
                default: application/pdf
              url:
                type: string
                format: uri
              category:
                type: string
                default: DOCUMENT
  responses:
    Problem:
      description: Errore.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    api_key_openapi:
      type: apiKey
      name: x-api-key
      in: header
    pn-auth-fleet_LollipopAuthorizer_openapi:
      type: apiKey
      name: x-pagopa-lollipop-auth-jwt
      in: header
      x-amazon-apigateway-authtype: custom
      x-amazon-apigateway-authorizer:
        authorizerUri: >-
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:pn-lollipopAuthorizerLambda/invocations
        authorizerResultTtlInSeconds: 300
        identitySource: >-
          method.request.header.x-pagopa-lollipop-auth-jwt,
          method.request.header.x-pagopa-lollipop-user-id
        type: request
tags:
  - name: IoConnector
    description: Operazioni verso App IO
  - name: FromIoMessage
    description: Endpoint invocati da App IO per il disclaimer di pre-apertura notifica
x-amazon-apigateway-gateway-responses:
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
  BAD_REQUEST_PARAMETERS:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
    responseTemplates:
      application/json: >-
        {"status": 400, "title": "VALIDATION ERROR", "traceId":
        "$context.xrayTraceId", "errors": [ { "code": "PN_INVALID_PARAMETERS",
        "detail": "Validation errors: $context.error.validationErrorString" } ]}
  BAD_REQUEST_BODY:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: '''*'''
    responseTemplates:
      application/json: >-
        {"status": 400, "title": "VALIDATION ERROR", "traceId":
        "$context.xrayTraceId", "errors": [ { "code": "PN_INVALID_BODY",
        "detail": "Validation errors: $context.error.validationErrorString" } ]}
x-amazon-apigateway-request-validators:
  basic:
    validateRequestBody: true
    validateRequestParameters: true
  params-only:
    validateRequestBody: false
    validateRequestParameters: true
x-amazon-apigateway-request-validator: basic
x-amazon-apigateway-binary-media-types:
  - '*/*'
