openapi: 3.0.3
info:
  title: pn-io-connector API
  version: 1.0.0
  description: API esposta da pn-io-connector per le operazioni verso App IO.

tags:
  - name: IoConnector
    description: Comunicazioni bonarie verso App IO
  - name: IoActivation
    description: Attivazione del servizio SEND su App IO e accettazione dei consensi
  - name: SendIoMessage
    description: Comunicazioni a valore legale verso App IO

paths:
  /io-connector/message:
    post:
      tags: [IoConnector]
      summary: Presa in carico di un messaggio verso App IO
      operationId: sendIOMessage
      description: >
        Endpoint sincrono invocato da client pagopa per richiedere l'invio
        di un messaggio a un cittadino tramite App IO. Il microservizio
        verifica, salvo errori di validazione, inserisce
        la richiesta nella coda di elaborazione.
      parameters:
        - $ref: '#/components/parameters/xPagopaIoConCxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Richiesta presa in carico per elaborazione asincrona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '204':
          description: Richiesta già ricevuta con stesso requestId e stesso payload (idempotenza). Nessun contenuto restituito.
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: requestId già esistente ma con payload diverso da quello originale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /io-connector/profile:
    post:
      tags: [IoConnector]
      summary: Verifica raggiungibilità profilo IO del destinatario
      description: >
        Endpoint invocato dal client pagopa (es. orchestratore SEND) per
        verificare se un cittadino è raggiungibile tramite App IO (profilo presente
        e sender_allowed = true).La risposta riporta status 
        (SENDER_ALLOWED / SENDER_NOT_ALLOWED) e, se il profilo è attivo, 
        le preferredLanguages restituite da IO.
      operationId: getIOProfile
      parameters:
        - $ref: '#/components/parameters/xPagopaIoConCxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetProfileRequest'
      responses:
        '200':
          description: Esito della verifica profilo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProfileResponse'
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /io-connector/messages/{id}:
    get:
      tags: [IoConnector]
      summary: Recupero metadati allegati di un messaggio
      description: >
        Endpoint invocato da BackEnd IO quando l'utente apre il dettaglio del messaggio
        su App IO. Viene verificato che il codice fiscale del destinatario
        sia coerente con quello associato al messaggio, richiesta a SafeStorage
        una PresignedUri per ciascun allegato e restituita una lista di metadati che
        potrà essere usata dal client App IO per richiedere il contenuto binario.
      operationId: getMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: requestId — identificativo di correlazione remota passato da pn-io-connector in third_party_data.id al momento dell'invio del messaggio
        - name: x-pagopa-pn-cx-id
          in: header
          required: true
          schema:
            type: string
          description: Identificativo interno (internalId) iniettato dall'API Gateway da context.authorizer.cx_id dopo la validazione Lollipop. Confrontato con il destinatario del messaggio per il controllo di coerenza.
      responses:
        '200':
          description: Metadati degli allegati associati al messaggio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMessageResponse'
        '404':
          description: Messaggio non trovato (richiesta inesistente o codice fiscale del chiamante non coerente con il destinatario).

  /io-connector/activations:
    post:
      tags: [IoActivation]
      summary: Lettura stato attivazione SEND su App IO
      description: >
        Endpoint di sola lettura: restituisce lo stato corrente di attivazione del
        servizio SEND sull'Activation Service di App IO.
      operationId: getIoActivation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FiscalCodePayload'
      responses:
        '200':
          description: Stato di attivazione corrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Utente non trovato su App IO.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      tags: [IoActivation]
      summary: Creazione o aggiornamento dell'attivazione SEND su App IO
      description: >
        Se lo stato richiesto è ACTIVE vengono prima registrati i consensi TOS
        e DATAPRIVACY per l'utente identificato dagli header auth-fleet, poi
        viene effettuato l'upsert dell'attivazione su App IO. Se lo stato
        richiesto è INACTIVE i consensi non vengono toccati. In caso di errore
        HTTP da IO viene tentato un fallback leggendo lo stato corrente tramite
        getIoActivation. Un errore sul ramo dei consensi interrompe
        l'operazione senza alcuna chiamata verso App IO.
      operationId: upsertIoActivation
      parameters:
        - $ref: '#/components/parameters/xPagopaPnUid'
        - $ref: '#/components/parameters/xPagopaPnCxType'
        - $ref: '#/components/parameters/xPagopaPnCxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationPayload'
      responses:
        '200':
          description: Stato di attivazione aggiornato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activation'
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: >
            Errore nella registrazione dei consensi o nell'aggiornamento
            dell'attivazione. Pilota il rollback lato consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /io-connector/user-status:
    post:
      tags: [SendIoMessage]
      summary: Verifica se l'utente è contattabile per il servizio SEND
      description: >
        Restituisce lo stato dell'utente rispetto ad App IO e al servizio SEND,
        con esito a quattro valori.
      operationId: getIoUserStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusRequest'
      responses:
        '200':
          description: Stato dell'utente rispetto ad App IO e al servizio SEND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /io-connector/sendmessage:
    post:
      tags: [SendIoMessage]
      summary: Invio di un messaggio su App IO per una notifica SEND
      description: >
        Il tipo di messaggio inviato (cortesia o opt-in) è determinato dallo
        stato dell'utente su App IO.
      operationId: sendLegalIOMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Esito dell'invio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          description: Richiesta malformata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: Errore interno del server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    xPagopaIoConCxId:
      name: x-pagopa-iocon-cx-id
      in: header
      required: true
      description: Identificativo del client che invoca il microservizio (cxId).
      schema:
        type: string

    xPagopaPnUid:
      name: x-pagopa-pn-uid
      in: header
      required: true
      description: >
        Identificativo dell'utente.
      schema:
        type: string
        maxLength: 64

    xPagopaPnCxType:
      name: x-pagopa-pn-cx-type
      in: header
      required: true
      description: Tipologia del soggetto per cui si effettua l'attivazione.
      schema:
        $ref: '#/components/schemas/CxTypeAuthFleet'

    xPagopaPnCxId:
      name: x-pagopa-pn-cx-id
      in: header
      required: true
      description: Identificativo del soggetto per cui si effettua l'attivazione.
      schema:
        type: string
        maxLength: 64

  schemas:

    MessageRequest:
      type: object
      required:
        - requestId
        - recipientTaxId
        - senderServiceId
        - subject
        - markdown
      properties:
        requestId:
          type: string
          description: Identificativo univoco della richiesta (generato dall'orchestratore SEND).
          example: "REQ-20260408-ABC123"
        iun:
          type: string
          description: Identificativo Univoco Notifica su SEND.
          example: "ABCD-EFGH-1234-5678-X"
        recipientTaxId:
          type: string
          description: Codice fiscale anonimizzato del destinatario del messaggio.
          example: "ABCDEFG1234567890"
        senderServiceId:
          type: string
          description: Id del servizio per il quale si invia una notifica.
          example: "000000000"
        subject:
          type: string
          description: Oggetto del messaggio (max 120 caratteri).
          maxLength: 120
        markdown:
          type: string
          description: >
            Corpo del messaggio in formato Markdown. Puo contenere sezioni
            in lingue diverse concatenate nel medesimo campo.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: Lista dei documenti allegati al messaggio.
          nullable: true
        sensitiveContent:
          type: boolean
          description: Indica se il messaggio contiene informazioni o dati sensibili.
          example: false
          nullable: true
        dueDate:
          type: string
          format: UTCISODateFromString
          description: Permette di associare al messaggio un promemoria. Il formato data deve essere ISO-8601 e fuso orario UTC
          example: 2022-09-30T22:00:00Z
        paymentData:
          $ref: '#/components/schemas/PaymentData'
        pollingMaxMins:
          type: integer
          description: >
            Numero massimo di minuti per cui effettuare il polling degli esiti.
            Se non valorizzato viene utilizzato il default configurato nella
            property pn.io-connector.polling-interval-mins.
          nullable: true

    Attachment:
      type: object
      required:
        - id
        - fileKey
        - name
      properties:
        id:
          type: string
          description: Identificativo dell'allegato.
        fileKey:
          type: string
          description: Chiave del file allegato (deve avere estensione .pdf).
        name:
          type: string
          maxLength: 127
          description: Nome allegato con desinenza ".pdf" obbligatoria.

    PaymentData:
      type: object
      required:
        - amount
        - noticeCode
        - creditorTaxId
      properties:
        amount:
          type: integer
          description: Importo in centesimi di euro.
          example: 1500
        noticeCode:
          type: string
          description: Codice avviso pagoPA.
          example: "302000100440009424"
        creditorTaxId:
          type: string
          description: Codice fiscale dell'ente creditore.
          example: "01234567890"
        invalidAfterDueDate:
          type: boolean
          description: In app visualizza il pagamento come scaduto se la data attuale è successiva a dueDate
    MessageResponse:
      type: object
      properties:
        xPagopaIoConCxId:
          type: string
        requestId:
          type: string
        status:
          type: string
          enum: [ACCEPTED]
          description: Richiesta di invio presa in carico.
    GetProfileRequest:
      type: object
      required:
        - recipientTaxId
        - senderServiceId
      properties:
        recipientTaxId:
          type: string
          description: Codice fiscale anonimizzato del destinatario.
          example: "ABCDEFG1234567890"
        senderServiceId:
          type: string
          description: >
            Id del servizio IO dell'ente mittente. Necessario per recuperare la ApiKey USE.
          example: "000000000"
    GetProfileResponse:
      type: object
      properties:
        status:
          type: string
          enum: [SENDER_ALLOWED, SENDER_NOT_ALLOWED]
          description: >
            SENDER_ALLOWED = profilo presente su IO e sender_allowed = true.
            SENDER_NOT_ALLOWED = profilo assente (HTTP 404 da IO) o sender_allowed = false.
        preferredLanguages:
          type: array
          nullable: true
          description: >
            Preferenze di lingua del destinatario..
            Valorizzato solo quando status = SENDER_ALLOWED.
          items:
            type: string
            example: "it_IT"
    GetMessageResponse:
      type: object
      description: Dettagli del messaggio e lista degli allegati esposti a BackEnd IO.
      properties:
        details:
          type: object
          properties:
            subject:
              type: string
              description: Titolo del messaggio.
            markdown:
              type: string
              description: Corpo del messaggio in formato markdown.
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Identificativo dell'allegato.
              name:
                type: string
                maxLength: 127
                description: Nome allegato con desinenza ".pdf" obbligatoria.
              content_type:
                type: string
                description: MIME type dell'allegato. Deve essere "application/pdf".
                default: application/pdf
              url:
                type: string
                description: FileKey corrispondente all'allegato in SafeStorage
              category:
                type: string
                description: Categoria dell'allegato. Deve essere "DOCUMENT".
                default: DOCUMENT

    OutcomeEvent:
      type: object
      description: >
        Contenuto del campo "detail" dell'evento pubblicato su EventBridge
        (source = "pn-io-connector", detail-type = "IoConnectorOutcomeEvent").
      properties:
        xPagopaIoConCxId:
          type: string
        requestId:
          type: string
        ioMessageId:
          type: string
          nullable: true
        noticeCode:
          type: string
          description: Codice avviso pagoPA.
          example: "302000100440009424"
          nullable: true
        eventType:
          type: string
          description: >
            SENT_TO_IO = messaggio inviato a IO;
            DELIVERED_TO_USER = messaggio consegnato all'utente;
            READ = messaggio letto;
            PAID = avviso pagato;
            SENDER_NOT_ALLOWED = destinatario non raggiungibile / mittente non abilitato;
            FAILED_TO_SEND = errore durante l'invio del messaggio verso IO;
          enum: [SENT_TO_IO, DELIVERED_TO_USER, READ, PAID, SENDER_NOT_ALLOWED, FAILED_TO_SEND]
        errorDetail:
          type: string
          description: >
            Causa del fallimento, valorizzato solo per eventType = FAILED_TO_SEND.
            Per errori di invio non retryable: "<http status> - <descrizione>".
            Per esaurimento delle retry: "Retry Exhausted".
          example: "400 - Bad Request"
          nullable: true
        eventTimestamp:
          type: string
          format: date-time
          description: Timestamp di generazione dell'evento
          example: "2026-06-26T10:15:30Z"
    ProblemDetail:
      type: object
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        traceId:
          type: string

    # --- Dominio legale -----------------------------------------------------

    CxTypeAuthFleet:
      type: string
      description: >
        Sottoinsieme dei valori auth-fleet.
      enum: [PF, PG]

    FiscalCodePayload:
      type: object
      required:
        - fiscal_code
      properties:
        fiscal_code:
          type: string
          description: Codice fiscale in chiaro del destinatario.
          minLength: 16
          maxLength: 16

    ActivationPayload:
      type: object
      required:
        - fiscal_code
        - status
      properties:
        fiscal_code:
          type: string
          description: Codice fiscale in chiaro del destinatario.
        status:
          $ref: '#/components/schemas/ActivationStatus'

    Activation:
      type: object
      required:
        - fiscal_code
        - status
      properties:
        fiscal_code:
          type: string
        status:
          $ref: '#/components/schemas/ActivationStatus'
        version:
          type: integer

    ActivationStatus:
      type: string
      enum: [ACTIVE, INACTIVE, PENDING]

    UserStatusRequest:
      type: object
      required:
        - taxId
      properties:
        taxId:
          type: string
          description: Codice fiscale in chiaro del destinatario.
          minLength: 16
          maxLength: 16

    UserStatusResponse:
      type: object
      required:
        - taxId
        - status
      properties:
        taxId:
          type: string
        status:
          type: string
          description: >
            APPIO_NOT_ACTIVE = utente non presente su App IO;
            PN_NOT_ACTIVE = utente presente ma servizio SEND non abilitato;
            PN_ACTIVE = utente presente con servizio SEND abilitato;
            ERROR = errore nella verifica dello stato.
          enum: [APPIO_NOT_ACTIVE, PN_NOT_ACTIVE, PN_ACTIVE, ERROR]

    SendMessageRequest:
      type: object
      required:
        - iun
        - recipientTaxID
        - recipientInternalID
        - recipientIndex
        - senderDenomination
      properties:
        requestId:
          type: string
          description: >
            Identificativo della richiesta, generato dal chiamante.
        iun:
          type: string
          description: Identificativo Univoco Notifica su SEND.
        recipientTaxID:
          type: string
          description: Codice fiscale in chiaro del destinatario.
        recipientInternalID:
          type: string
          description: Identificativo interno (internalId) del destinatario.
        recipientIndex:
          type: integer
          description: Indice del destinatario all'interno della notifica.
        senderDenomination:
          type: string
          description: Denominazione dell'ente mittente.
        subject:
          type: string
          description: Oggetto della notifica.
        due_date:
          type: string
          format: date-time
        requestAcceptedDate:
          type: string
          format: date-time
        carbonCopyToDeliveryPush:
          type: boolean
          default: false
          description: >
            Se true, a invio riuscito viene pubblicato l'evento SQS verso
            pn-delivery-push per l'aggiornamento della timeline.
        deliveryMode:
          type: string
          enum: [DIGITAL, ANALOG]
          description: Determina la selezione del template di opt-in. Default ANALOG se assente.

    SendMessageResponse:
      type: object
      properties:
        result:
          type: string
          enum:
            - SENT_COURTESY
            - SENT_OPTIN
            - NOT_SENT_APPIO_UNAVAILABLE
            - NOT_SENT_OPTIN_ALREADY_SENT
            - NOT_SENT_OPTIN_DISABLED_BY_CONF
            - NOT_SENT_COURTESY_DISABLED_BY_CONF
            - ERROR_USER_STATUS
            - ERROR_COURTESY
            - ERROR_OPTIN
        id:
          type: string
          description: Identificativo del messaggio su App IO, se inviato.
        requestId:
          type: string
          description: >
            Identificativo della richiesta, coincidente con quello fornito dal
            chiamante o generato dal microservizio se assente.
